# PostgreSQL Configuration for Moodle Enterprise
# Optimized for 8GB RAM server with 500+ concurrent users

# CONNECTIONS AND AUTHENTICATION
max_connections = 200
superuser_reserved_connections = 3

# MEMORY SETTINGS
shared_buffers = 2GB                    # 25% of RAM
effective_cache_size = 6GB              # 75% of RAM
maintenance_work_mem = 512MB
work_mem = 32MB                         # shared_buffers / max_connections
wal_buffers = 16MB

# QUERY TUNING
random_page_cost = 1.1                  # SSD optimized (default 4.0 for HDD)
effective_io_concurrency = 200          # SSD optimized
default_statistics_target = 100

# WRITE AHEAD LOG (WAL)
wal_level = replica
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_compression = on

# AUTOVACUUM
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min

# LOGGING
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_lock_waits = on
log_statement = 'none'                  # Change to 'all' for debugging
log_temp_files = 0

# LOCALE
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# TIMEZONE
timezone = 'America/Argentina/Buenos_Aires'
